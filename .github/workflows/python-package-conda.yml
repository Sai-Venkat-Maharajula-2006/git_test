name: Streamlit App

on:
  push:
    branches:
      - main

jobs:
  run-streamlit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install streamlit

      - name: Check Streamlit app
        run: |
          python -m py_compile app.py
